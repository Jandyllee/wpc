<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Forgot Password - WESTPRIME CONFESSIONS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="recovery-page" data-page="forgot-password">
  <main class="recovery-card">
    <div class="recovery-heading">
      <span class="recovery-icon"><i class="fa-solid fa-key" aria-hidden="true"></i></span>
      <h1>Forgot password?</h1>
      <p>Enter the email address linked to your account. We’ll send you a six-digit verification code.</p>
    </div>

    <div id="forgotPasswordStatus" class="form-status hidden" role="status" aria-live="polite"></div>

    <form id="forgotPasswordForm">
      <div class="form-group">
        <label for="resetEmail">Email address</label>
        <input type="email" id="resetEmail" name="email" autocomplete="email" maxlength="254" required>
      </div>
      <button type="submit" class="btn btn-yellow recovery-submit">
        <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send verification code
      </button>
    </form>

    <p class="recovery-back"><a href="index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to login</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
