<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Westprime Diaries - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">

  <!-- HEADER -->
  <header>
    <div class="nav-container">
      <div class="brand-logo">
        <i class="fa-solid fa-shield-halved"></i>
        <div class="brand-title">
          <h1>ADMIN DASHBOARD</h1>
          <p>Westprime Diaries Moderation</p>
        </div>
      </div>

      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline"><i class="fa-solid fa-house"></i> Home</a>
      </div>
    </div>
  </header>

  <div class="main-container single-col">

    <!-- ADMIN LOGIN GATE -->
    <div class="auth-card" id="adminGate">
      <h3 style="margin-bottom: 1rem;"><i class="fa-solid fa-key"></i> Administrator Access</h3>
      <form id="adminLoginForm">
        <div class="form-group">
          <label>Admin Password</label>
          <input type="password" id="adminPasswordInput" placeholder="Enter administrative password" required>
        </div>
        <button type="submit" class="btn btn-yellow" style="width: 100%; justify-content: center; margin-top: 10px;">
          Unlock Panel
        </button>
      </form>
    </div>

    <!-- ADMIN PANEL CONTENT (Hidden until authenticated) -->
    <div class="admin-panel hidden" id="adminPanel">
      <div class="section-title">
        <i class="fa-solid fa-list-check"></i> Manage Confessions Database
      </div>

      <div class="feed-container" id="adminFeedContainer">
        <!-- Moderation items loaded dynamically -->
      </div>
    </div>

  </div>

  <footer>
    <p>&copy; 2026 Westprime Diaries. All Rights Reserved.</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
