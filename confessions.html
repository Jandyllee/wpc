<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Westprime Diaries - Live Confessions Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="confessions">

  <!-- HEADER -->
  <header>
    <div class="nav-container">
      <div class="brand-logo">
        <i class="fa-solid fa-book-bookmark"></i>
        <div class="brand-title">
          <h1>WESTPRIME DIARIES</h1>
          <p>Campus Confessions</p>
        </div>
      </div>

      <!-- Live Search Bar -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search confessions or tags...">
      </div>

      <div class="nav-actions">
        <span class="user-greeting" id="userGreeting">Loading...</span>
        <button class="btn btn-outline" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </div>
  </header>

  <!-- SINGLE-COLUMN SCROLLABLE FEED CONTAINER -->
  <div class="main-container scrollable-feed">

    <!-- POST FORM SECTION (TOP) -->
    <section class="widget post-widget">
      <div class="widget-title"><i class="fa-solid fa-pen-nib"></i> Post New Confession</div>
      <form class="quick-post-form" id="confessionForm">
        <input type="text" id="postTagInput" placeholder="To / Tag (e.g. To STEM-A, Crush)" required>
        <textarea id="postContentInput" rows="4" placeholder="Write your confession here..." required></textarea>
        <button type="submit" class="btn btn-yellow" style="width: 100%; justify-content: center;">
          <i class="fa-solid fa-paper-plane"></i> Publish Entry
        </button>
      </form>
    </section>

    <!-- CONFESSIONS FEED SECTION (BOTTOM) -->
    <main class="feed-section">
      <div class="section-title">
        <i class="fa-solid fa-comments"></i> Confessions Feed
      </div>

      <div class="feed-container" id="feedContainer">
        <!-- Confession items dynamically loaded from script.js -->
      </div>
    </main>

  </div>

  <footer>
    <p>&copy; 2026 Westprime Diaries. All Rights Reserved.</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
