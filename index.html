<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Westprime Diaries - Home Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">

  <!-- NAVBAR -->
  <header>
    <div class="nav-container">
      <div class="brand-logo">
        <i class="fa-solid fa-book-bookmark"></i>
        <div class="brand-title">
          <h1>WESTPRIME DIARIES</h1>
          <p>Campus Portal & Community</p>
        </div>
      </div>

      <div class="nav-actions">
        <a href="admin.html" class="btn btn-outline"><i class="fa-solid fa-user-shield"></i> Admin Dashboard</a>
      </div>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-content">
      <span class="hero-badge"><i class="fa-solid fa-lock"></i> Account Required to Post</span>
      <h2>Welcome to Westprime Diaries</h2>
      <p>Please enter your username or register to access the confessions feed, post your stories, and react to campus diaries.</p>
    </div>
  </section>

  <!-- HOME CONTENT & AUTHENTICATION CONTAINER -->
  <div class="main-container single-col">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab">Login</button>
        <button class="auth-tab" id="registerTab">Register Account</button>
      </div>

      <!-- LOGIN FORM -->
      <form class="modal-form" id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="e.g. SecretStudent" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-yellow" style="width: 100%; justify-content: center; margin-top: 10px;">
          <i class="fa-solid fa-right-to-bracket"></i> Login to Access Confessions
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form class="modal-form hidden" id="registerForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="regUsername" placeholder="Choose a username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Create password" required>
        </div>
        <button type="submit" class="btn btn-yellow" style="width: 100%; justify-content: center; margin-top: 10px;">
          <i class="fa-solid fa-user-plus"></i> Create Account & Proceed
        </button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Westprime Diaries. All Rights Reserved.</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
